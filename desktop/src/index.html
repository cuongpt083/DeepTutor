<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeepTutor</title>
  <style>
    :root {
      --bg: #090d16;
      --card: #131b2e;
      --border: #23304e;
      --primary: #3b82f6;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 420px;
      padding: 32px;
      border-radius: 24px;
      background: radial-gradient(circle at top, #1a2744 0%, var(--card) 100%);
      border: 1px solid var(--border);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    .logo {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: bold;
      color: white;
      margin-bottom: 24px;
      box-shadow: 0 8px 24px rgba(59, 130, 246, 0.4);
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }
    p {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .spinner-bar {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }
    .spinner-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, #3b82f6, #60a5fa);
      border-radius: 999px;
      animation: indeterminate 1.5s infinite ease-in-out;
    }
    @keyframes indeterminate {
      0% { left: -40%; width: 40%; }
      50% { left: 30%; width: 60%; }
      100% { left: 100%; width: 40%; }
    }
    .error-box {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      font-size: 12px;
      text-align: left;
    }
    button.retry-btn {
      display: none;
      margin-top: 16px;
      padding: 8px 16px;
      background: var(--primary);
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    button.retry-btn:hover {
      background: #2563eb;
    }
  </style>
</head>
<body>
  <div class="splash-container">
    <div class="logo">DT</div>
    <h1>DeepTutor</h1>
    <p id="status-text">Starting AI learning companion...</p>
    <div class="spinner-bar" id="spinner">
      <div class="spinner-fill"></div>
    </div>
    <div class="error-box" id="error-box"></div>
    <button class="retry-btn" id="retry-btn" onclick="checkBackend()">Retry</button>
  </div>

  <script>
    async function checkBackend() {
      const statusText = document.getElementById("status-text");
      const errorBox = document.getElementById("error-box");
      const retryBtn = document.getElementById("retry-btn");
      const spinner = document.getElementById("spinner");

      errorBox.style.display = "none";
      retryBtn.style.display = "none";
      spinner.style.display = "block";
      statusText.textContent = "Connecting to backend service...";

      try {
        if (window.__TAURI__ && window.__TAURI__.core) {
          const invoke = window.__TAURI__.core.invoke;
          let retries = 0;
          const maxRetries = 60; // 30 seconds (500ms intervals)

          const interval = setInterval(async () => {
            retries++;
            try {
              const status = await invoke("get_backend_status");
              if (status.is_ready) {
                clearInterval(interval);
                statusText.textContent = "Loading interface...";
                const url = await invoke("get_backend_url");
                window.location.replace(url);
                return;
              }

              if (retries >= maxRetries) {
                clearInterval(interval);
                throw new Error(status.error || "Timed out waiting for backend to start.");
              }
            } catch (err) {
              if (retries >= maxRetries) {
                clearInterval(interval);
                showError(err.message || String(err));
              }
            }
          }, 500);
        } else {
          // Direct browser testing fallback: check default port
          setTimeout(() => {
            window.location.replace("http://127.0.0.1:8001");
          }, 1500);
        }
      } catch (err) {
        showError(err.message || String(err));
      }

      function showError(msg) {
        spinner.style.display = "none";
        statusText.textContent = "Startup failed";
        errorBox.textContent = msg;
        errorBox.style.display = "block";
        retryBtn.style.display = "inline-block";
      }
    }

    window.addEventListener("DOMContentLoaded", checkBackend);
  </script>
</body>
</html>
